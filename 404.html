<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Custom 404 error page for Saiman Silwal's web programming portfolio.">
  <title>404 — Page Not Found | Saiman Silwal</title>
  <style>
    :root{color-scheme:dark;--bg:#101827;--panel:#17263e;--lime:#a7f36b;--muted:#b7c3d4;--line:rgba(255,255,255,.14)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#263c5b 0%,var(--bg) 62%);color:#f7f9fc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,680px);padding:clamp(28px,7vw,64px);text-align:center;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(23,38,62,.96),rgba(14,23,38,.96));box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .mark{display:inline-grid;place-items:center;width:54px;height:54px;border:1px solid rgba(167,243,107,.5);border-radius:16px;color:var(--lime);font-weight:800;letter-spacing:-.06em}
    .code{margin:28px 0 0;color:var(--lime);font-size:clamp(5rem,19vw,9rem);font-weight:900;letter-spacing:-.09em;line-height:.9}
    h1{margin:24px 0 12px;font-size:clamp(1.7rem,5vw,2.5rem);letter-spacing:-.04em}
    p{max-width:470px;margin:0 auto;color:var(--muted);font-size:1.05rem;line-height:1.7}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border:1px solid var(--lime);border-radius:10px;background:var(--lime);color:#142014;font-weight:800;text-decoration:none}
    a.secondary{background:transparent;color:#f7f9fc;border-color:var(--line)}
    a:hover{filter:brightness(1.08)}
    a:focus-visible{outline:3px solid #fff;outline-offset:4px}
    .foot{margin-top:36px;font-size:.82rem;color:#8fa0b8}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-label="Saiman Silwal initials">SS</div>
    <div class="code" aria-hidden="true">404</div>
    <h1>Oops! This page wandered off.</h1>
    <p>The link may be broken, or the page may have moved. Let's get you back to the projects and assignments.</p>
    <div class="actions">
      <a href="https://saimansilwal7-oss.github.io/saiman-silwal-202537200/">Back to my website</a>
      <a class="secondary" href="https://github.com/saimansilwal7-oss/custom-404.html">View 404 assignment</a>
    </div>
    <div class="foot">SAIMAN SILWAL · WEB PROGRAMMING</div>
  </main>
</body>
</html>
